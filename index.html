<!DOCTYPE html>
<html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Stick Fighter Arena</title><style>
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:#0d0818;color:#eee;font:14px system-ui,sans-serif}
canvas{position:fixed;inset:0;width:100vw;height:100vh;display:block}
#result{position:fixed;inset:0;z-index:10;background:rgba(10,5,20,.82);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px}
#result[hidden],#panel[hidden]{display:none}
#result h1{margin:0;font-size:38px}
table{border-collapse:collapse;min-width:420px}
th,td{padding:5px 16px;text-align:center;border-bottom:1px solid #ffffff22}
button{background:#f0794f;color:#1a0f2b;border:0;border-radius:6px;padding:8px 14px;font-weight:700;cursor:pointer}
#gear{position:fixed;right:12px;bottom:12px;z-index:5}
#panel{position:fixed;right:12px;bottom:56px;z-index:5;width:470px;max-width:96vw;max-height:75vh;overflow:auto;background:#150b2ee8;border:1px solid #ffffff30;border-radius:8px;padding:10px;display:flex;flex-direction:column;gap:8px}
#rows{display:flex;flex-direction:column;gap:5px}
.row{display:flex;gap:4px;align-items:center}
.row input[type=text]{width:92px;background:#0004;border:1px solid #ffffff33;color:#fff;border-radius:4px;padding:3px 5px}
.row select{background:#0004;color:#fff;border:1px solid #ffffff33;border-radius:4px;padding:3px;max-width:105px}
.row input[type=color]{width:26px;height:26px;border:0;padding:0;background:none}
</style></head>
<body>
<canvas id="c"></canvas><div id="result" hidden></div>
<button id="gear">⚙ Ayarlar</button>
<div id="panel" hidden>
  <div id="rows"></div>
  <label>Oyun hızı <input id="speed" type="range" min="0.5" max="2" step="0.1" value="1"></label>
  <div><button id="rnd">🎲 Rastgele silahlar</button> <button id="restart">Yeni savaş (R)</button></div>
</div>

class FX {
  constructor() { this.p = []; this.t = []; this.r = []; this.shake = 0; }
  clear() { this.p = []; this.t = []; this.r = []; this.shake = 0; }
  burst(x, y, col, n = 10, sp = 380) {
    for (let i = 0; i < n; i++) {
      const a = Math.random() * 6.28, v = sp * (.3 + Math.random() * .7);
      this.p.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v - 120, l: .35 + Math.random() * .3, m: .65, s: 2 + Math.random() * 3, c: col, g: 1 });
    }
  }
  dust(x, y) {
    for (let i = 0; i < 6; i++) this.p.push({ x: x + (Math.random() - .5) * 30, y: y - 2, vx: (Math.random() - .5) * 160, vy: -Math.random() * 70, l: .5, m: .5, s: 4 + Math.random() * 5, c: '#cbbfae', g: 0 });
  }
  text(x, y, s, c) { this.t.push({ x, y, s, c, l: .8 }); }
  ring(x, y, c) { this.r.push({ x, y, c, l: .5 }); this.burst(x, y, c, 18, 500); }
  update(dt) {
    this.shake *= Math.pow(.001, dt);
    for (const p of this.p) { p.l -= dt; p.x += p.vx * dt; p.y += p.vy * dt; p.vy += p.g * 1400 * dt; }
    this.p = this.p.filter(p => p.l > 0);
    for (const t of this.t) { t.l -= dt; t.y -= 60 * dt; }
    this.t = this.t.filter(t => t.l > 0);
    for (const r of this.r) r.l -= dt; this.r = this.r.filter(r => r.l > 0);
  }

    for (const r of this.r) { c.globalAlpha = r.l * 2; c.strokeStyle = r.c; c.lineWidth = 6; c.beginPath(); c.arc(r.x, r.y, (.5 - r.l) * 600, 0, 7); c.stroke(); }
    for (const p of this.p) { c.globalAlpha = Math.min(1, p.l / p.m * 1.5); c.fillStyle = p.c; c.fillRect(p.x - p.s / 2, p.y - p.s / 2, p.s, p.s); }

    c.globalAlpha = 1;

// Yapay zekâ: silaha göre mesafe, platform gezinmesi, zıplayarak kaçınma/atılma, duvara tutunma.
const AI = {
  target(f, list) {
    let b = null, bd = 1e9;
    for (const o of list) { if (o === f || o.hp <= 0) continue; const d = Math.abs(o.x - f.x) + Math.abs(o.y - f.y) * .5; if (d < bd) { bd = d; b = o; } }
    return b;
  },
  // Hedef yüksekteyse, ulaşılabilir ve hedefe en yakın platformu seç
  nav(f, o) {
    let best = null, bs = 1e9;
    for (const p of CFG.plats) if (p.y < f.y - 30 && p.y >= f.y - 230) { const sc = Math.abs(p.x + p.w / 2 - o.x) + Math.abs(p.y - o.y); if (sc < bs) { bs = sc; best = p; } }
    return best;
  },
  run(f, list, dt) {
    const i = f.intent = { mx: 0 }, o = this.target(f, list); if (!o) return;
    const s = f.style, w = f.w, gun = w.t !== 'm', dx = o.x - f.x, d = Math.abs(dx), dy = Math.abs(o.y - f.y), dir = Math.sign(dx) || 1;
    const free = f.state === 'idle' || f.state === 'run', onG = f.y >= f.fl - 1;
    const reach = gun ? Math.min(w.rng, 600) : w.rng * .85, near = (gun ? reach * .6 : reach * .8) + s.pref;
    if (free && !f.wall) f.face = dir;
    f.thinkT -= dt;
    if (f.thinkT <= 0) {
      f.thinkT = .15 + Math.random() * .3; const r = Math.random();
      if (G.idle > 6) f.mode = d > near ? 'approach' : 'attack'; // uzun süre hasar yoksa herkes saldırır
      else if (s.rnd && r < s.rnd) f.mode = ['approach', 'retreat', 'wait', 'jump', 'wall'][Math.random() * 5 | 0];
      else if (f.hp < f.maxHp * .25 && d < 350 && r < s.defend + .3) f.mode = 'retreat';
      else if (d > near) f.mode = r < s.aggr ? 'approach' : 'wait';
      else f.mode = r < s.aggr ? 'attack' : (r < s.aggr + s.defend / 2 ? 'retreat' : 'wait');
      if (G.idle <= 6) {
        if (gun && d < 140 && dy < 90 && r < .6) f.mode = 'retreat';
        if (Math.random() < s.jump * .5) f.mode = 'jump'; else if (Math.random() < s.jump * .35) f.mode = 'wall';
      }
    }
    if (f.wall) { i.mx = -f.wall; return; }
    if (free && onG && f.en >= 100 && d < CFG.SPECIALS[f.c.special].r && Math.random() < dt * 3) { f.begin('special'); f.sp = f.c.special; f.en = 0; return; }
    // Üstüne gelen mermiyi zıplayarak aş
    if (free && onG) for (const b of G.bullets) {
      if (b.o === f) continue; const ah = (f.x - b.x) * Math.sign(b.vx);
      if (ah > 0 && ah < 350 && Math.abs(b.y - (f.y - 65)) < 70 && Math.random() < dt * 10) { i.jump = true; i.mx = dir; return; }
    }
    const atk = o.state === 'punch' || o.state === 'swing' || o.state === 'kick';
    if (free && atk && d < 115 && f.dodgeCD <= 0 && onG && Math.random() < s.defend * dt * 6) { f.dodgeCD = 1.2; if (Math.random() < .6) f.begin('block'); else { f.vx = -dir * 380; f.vy = -520; f.invul = .25; } return; }
    // Hedef yukarıdaysa platform zinciriyle çık, havadayken çift zıpla
    if (free && onG && o.y < f.y - 70) {
      const p = this.nav(f, o);
      if (p) { const cx = p.x + p.w / 2; if (Math.abs(cx - f.x) < p.w / 2 - 20) { i.jump = true; i.mx = Math.sign(cx - f.x) * .3; } else i.mx = Math.sign(cx - f.x); return; }
    }
    if (free && !onG && f.jumps < 2 && o.y < f.y - 60 && f.vy > -150 && Math.random() < dt * 6) { i.jump = true; i.mx = dir; return; }
    // Yakın dövüşçü uzaktan zıplayarak üstüne atılır
    if (!gun && free && onG && d > 220 && d < 600 && dy < 100 && Math.random() < dt * 1.5) { i.jump = true; i.mx = dir; return; }
    const m = f.mode, sp = !gun && d > 250 ? 1.35 : 1;
    if (gun && free && m !== 'attack' && dy < 80 && d < reach && d > 55 && Math.random() < dt * 6) i.punch = true;
    if (m === 'approach') i.mx = d > near ? dir * sp : 0;
    else if (m === 'retreat') { if (f.x < CFG.L + 60 || f.x > CFG.R - 60) f.mode = 'attack'; else i.mx = -dir; }
    else if (m === 'jump') { i.jump = true; i.mx = dir; f.mode = 'approach'; }
    else if (m === 'wall') {
      const side = f.x < CFG.W / 2 ? -1 : 1; i.mx = side;
      if (onG && Math.abs(f.x - (side < 0 ? CFG.L : CFG.R)) < 300) i.jump = true;
      if (G.idle > 6) f.mode = 'approach';
    }
    else if (m === 'attack') {
      if (d < 55 && dy < 70 && Math.random() < .3) i.kick = true;
      else if (d < reach && dy < 80) i.punch = true;
      else i.mx = dir * sp;
    }
  }
};

// Ana döngü: tam ekran arena, mermiler, özel hareketler, sonuç ekranı, arayüz
const cv = document.getElementById('c'), ctx = cv.getContext('2d'), R = document.getElementById('result');
const fx = new FX(), esc = s => String(s).replace(/[&<>"]/g, c => '&#' + c.charCodeAt(0) + ';');
const G = { fx, fighters: [], bullets: [], beams: [], dmg: 1, idle: 0, flash: 0 };
let idleT = 0, bg, over = false, endT = 0, elapsed = 0, slow = 0, stop = 0, speed = 1, last = performance.now();

function layout() {
  const K = CFG.K; cv.width = innerWidth; cv.height = innerHeight;
  const W = CFG.W = innerWidth / K, H = CFG.H = innerHeight / K, g = CFG.GROUND = H - 70;
  CFG.R = W - 40;
  CFG.plats = [[.03, .15, 170], [.82, .15, 170], [.42, .16, 170], [.2, .14, 340], [.66, .14, 340], [.43, .14, 510]]
    .map(([x, w, h]) => ({ x: W * x, w: Math.max(200, W * w), y: g - h }));

// a, b'ye vurur. mult: hasar çarpanı, down: yere devirir, dir: savrulma yönü
G.hit = (a, b, mult, down, dir = a.face, shk = 5) => {
  const blk = b.state === 'block' && b.face === -dir && mult < 2.5, dm = a.c.atk * mult * G.dmg * (.85 + Math.random() * .3) * (blk ? .2 : 1), d = Math.min(b.hp, dm);
  b.hp -= dm; a.stats.dealt += d; b.stats.taken += d; a.en = Math.min(100, a.en + 10); b.en = Math.min(100, b.en + 7);
  const px = b.x - dir * 10, py = b.y - 80;
  fx.burst(px, py, '#fff', 8); fx.burst(px, py, a.color, 8); fx.text(b.x, b.y - 135, Math.round(dm), '#ffd54f');
  fx.shake = Math.max(fx.shake, shk + mult * 1.5); stop = .05; G.idle = 0;
  if (blk) { b.vx = dir * 220; fx.text(b.x, b.y - 155, 'blok', '#fff'); return; }
  b.combo++;
  if (b.hp <= 0) { b.hp = 0; a.stats.kills++; b.down(dir, 1); fx.shake = 18; slow = .9; G.flash = .1; fx.burst(px, py, '#ffb74d', 24, 520); }
  else if (down || b.combo >= 3) { b.down(dir, 0); G.flash = .05; } else b.hurt(dir);
};
G.aoe = (a, r, mult, down) => {
  for (const o of G.fighters) { if (o === a || !o.canBeHit()) continue; const dx = o.x - a.x; if (Math.abs(dx) < r && Math.abs(o.y - a.y) < 160) G.hit(a, o, mult, down, Math.sign(dx) || 1, 10); }
};
G.special = (f, sp) => {
  const o = AI.target(f, G.fighters), dir = o ? Math.sign(o.x - f.x) || f.face : f.face;
  slow = Math.max(slow, .35); fx.shake = Math.max(fx.shake, 12); fx.ring(f.x, f.y - 60, f.color);
  if (sp === 'dash' && o) {
    fx.burst(f.x, f.y - 60, f.color, 24, 500);
    f.x = Math.max(CFG.L, Math.min(CFG.R, o.x + dir * 60)); f.y = o.y; f.vy = 0; f.face = -dir;
    fx.burst(f.x, f.y - 60, f.color, 24, 500); if (o.canBeHit()) G.hit(f, o, 3, true, -dir, 12);
  } else if (sp === 'fireball') G.bullets.push({ x: f.x + f.face * 40, y: f.y - 65, vx: f.face * 750, r: 20, dmg: 3, big: 1, c: '#ff6d00', o: f, l: 2 });
  else if (sp === 'slam') f.vy = -1100;
  else if (sp === 'blast') { fx.burst(f.x, f.y - 60, '#fff', 40, 700); G.aoe(f, 280, 2.5, true); }
};

function start() {
  const list = CFG.FIGHTERS.filter(c => c.on !== false);
  if (list.length < 2) { CFG.FIGHTERS.forEach(c => c.on = true); document.querySelectorAll('.row input[type=checkbox]').forEach(e => e.checked = true); return start(); }
  const n = list.length;
  G.fighters = list.map((c, i) => new Fighter(c, i, 120 + i * (CFG.W - 240) / (n - 1), i < n / 2 ? 1 : -1));
  G.bullets = []; G.beams = []; G.idle = 0; over = false; endT = 0; elapsed = 0; slow = 0; fx.clear(); R.hidden = true;
}

function showResult(w) {
  const m = Math.floor(elapsed / 60), s = Math.floor(elapsed % 60);
  const rows = [...G.fighters].sort((a, b) => b.stats.kills - a.stats.kills || b.stats.dealt - a.stats.dealt)
    .map(f => `<tr><td style="color:${f.color}">${esc(f.name)}</td><td>${f.stats.dealt | 0}</td><td>${f.stats.taken | 0}</td><td>${f.stats.kills}</td></tr>`).join('');
  R.innerHTML = `<h1 style="color:${w ? w.color : '#fff'}">${w ? esc(w.name) + ' kazandı!' : 'Berabere!'}</h1><p>Süre: ${m}:${String(s).padStart(2, '0')}</p>
  <table><tr><th>Savaşçı</th><th>Verilen hasar</th><th>Alınan hasar</th><th>Eleme</th></tr>${rows}</table><button onclick="start()">Yeniden savaş</button>`;
  R.hidden = false;
}

function hud() {
  const n = G.fighters.length, w = (cv.width - 40) / n;
  G.fighters.forEach((f, i) => {
    const x = 20 + i * w + 4, bw = w - 8;
    ctx.globalAlpha = f.hp > 0 ? 1 : .4; ctx.textAlign = 'left'; ctx.font = 'bold 14px sans-serif'; ctx.fillStyle = f.color; ctx.fillText(f.name + ' · ' + f.w.n, x, 24);
    ctx.fillStyle = 'rgba(0,0,0,.55)'; ctx.fillRect(x, 30, bw, 12); ctx.fillStyle = f.color; ctx.fillRect(x, 30, bw * f.hp / f.maxHp, 12);
    ctx.strokeStyle = '#fff6'; ctx.lineWidth = 1; ctx.strokeRect(x, 30, bw, 12);
    ctx.fillStyle = 'rgba(0,0,0,.55)'; ctx.fillRect(x, 45, bw, 5); ctx.fillStyle = f.en >= 100 ? '#fff' : '#ffd740'; ctx.fillRect(x, 45, bw * f.en / 100, 5);
  });
  ctx.globalAlpha = 1;
}

function frame(now) {
  const real = Math.min(.033, (now - last) / 1000); last = now;
  if (slow > 0) slow -= real; if (stop > 0) stop -= real;
  const dt = real * (stop > 0 ? .08 : slow > 0 ? .3 : 1) * speed, F = G.fighters;
  if (!over) { elapsed += dt; G.idle += dt; }
  for (const f of F) { if (over || f.hp <= 0) f.intent = { mx: 0 }; else AI.run(f, F, dt); f.update(dt, G); }
  for (let i = 0; i < F.length; i++) for (let j = i + 1; j < F.length; j++) {
    const a = F[i], b = F[j]; if (a.hp <= 0 || b.hp <= 0 || Math.abs(a.y - b.y) > 40 || a.y < a.fl - 5 || b.y < b.fl - 5) continue;
    const dx = b.x - a.x, ad = Math.abs(dx);
    if (ad < 30) { const p = (30 - ad) * .5 * (Math.sign(dx) || 1); a.x -= p; b.x += p; }
  }
  for (const b of G.bullets) {
    b.x += b.vx * dt; b.y += (b.vy || 0) * dt; b.l -= dt; if (b.big) fx.burst(b.x, b.y, '#ffab40', 1, 60);
    for (const o of F) if (o !== b.o && o.canBeHit() && Math.abs(b.x - o.x) < 20 + b.r && Math.abs(b.y - (o.y - 65)) < 55) {
      G.hit(b.o, o, b.dmg * (b.rg ? 1 - .5 * Math.min(1, Math.abs(b.x - b.x0) / b.rg) : 1), !!b.big, Math.sign(b.vx), 4); fx.burst(b.x, b.y, b.c, b.big ? 20 : 8); b.l = 0; break;
    }
  }
  G.bullets = G.bullets.filter(b => b.l > 0 && b.x > -50 && b.x < CFG.W + 50);
  for (const b of G.beams) b.l -= real; G.beams = G.beams.filter(b => b.l > 0);
  fx.update(dt);
  const alive = F.filter(f => f.hp > 0);
  if (!over && alive.length <= 1) { over = true; endT = 0; }
  if (over) {
    endT += real; const w = alive[0];
    if (w && endT > 1.3 && (w.state === 'idle' || w.state === 'run')) { w.state = 'win'; w.t = 0; }
    if (endT > 3.8 && R.hidden) showResult(w);
  }
  ctx.setTransform(CFG.K, 0, 0, CFG.K, 0, 0); ctx.drawImage(bg, 0, 0);
  ctx.translate((Math.random() - .5) * fx.shake, (Math.random() - .5) * fx.shake);
  [...F].sort((a, b) => a.y - b.y).forEach(f => f.draw(ctx));
  for (const b of G.bullets) {
    ctx.shadowColor = b.c; ctx.shadowBlur = 12; ctx.fillStyle = ctx.strokeStyle = b.c;
    if (b.big) { ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, 7); ctx.fill(); } else { ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(b.x, b.y); ctx.lineTo(b.x - Math.sign(b.vx) * 18, b.y); ctx.stroke(); }
  }
  for (const b of G.beams) { ctx.shadowColor = b.c; ctx.shadowBlur = 20; ctx.globalAlpha = Math.min(1, b.l * 8); ctx.strokeStyle = b.c; ctx.lineWidth = 8; ctx.beginPath(); ctx.moveTo(b.x1, b.y1); ctx.lineTo(b.x2, b.y2); ctx.stroke(); ctx.strokeStyle = '#fff'; ctx.lineWidth = 3; ctx.stroke(); }
  ctx.shadowBlur = 0; ctx.globalAlpha = 1;
  fx.draw(ctx); ctx.setTransform(1, 0, 0, 1, 0, 0);
  if (G.flash > 0) { G.flash -= real; ctx.fillStyle = 'rgba(255,255,255,.3)'; ctx.fillRect(0, 0, cv.width, cv.height); }
  hud();
  requestAnimationFrame(frame);
}

// Arayüz: isim, renk, silah, özel hareket, katılım
const rowsEl = document.getElementById('rows'), panel = document.getElementById('panel');
const opt = (o, v) => Object.entries(o).map(([k, x]) => `<option value="${k}"${k === v ? ' selected' : ''}>${x.n}</option>`).join('');
CFG.FIGHTERS.forEach(c => {
  const r = document.createElement('div'); r.className = 'row';
  r.innerHTML = `<input type="checkbox" checked><input type="color" value="${c.color}"><input type="text" value="${esc(c.name)}" maxlength="14"><select>${opt(CFG.WEAPONS, c.weapon)}</select><select>${opt(CFG.SPECIALS, c.special)}</select>`;
  const [on, col, nm] = r.querySelectorAll('input'), [ws, ss] = r.querySelectorAll('select');
  on.onchange = () => c.on = on.checked; col.oninput = () => c.color = col.value; nm.oninput = () => c.name = nm.value;
  ws.onchange = () => c.weapon = ws.value; ss.onchange = () => c.special = ss.value; c.ui = { ws, ss }; rowsEl.append(r);
});
document.getElementById('speed').oninput = e => speed = +e.target.value;
document.getElementById('restart').onclick = start;
document.getElementById('gear').onclick = () => panel.hidden = !panel.hidden;
document.getElementById('rnd').onclick = () => CFG.FIGHTERS.forEach(c => {
  const W = Object.keys(CFG.WEAPONS), S = Object.keys(CFG.SPECIALS);
  c.weapon = c.ui.ws.value = W[Math.random() * W.length | 0]; c.special = c.ui.ss.value = S[Math.random() * S.length | 0];
});
addEventListener('keydown', e => { if (e.key === 'r' || e.key === 'R') start(); });
addEventListener('resize', layout);
layout(); start(); requestAnimationFrame(frame);

</script>
</body></html>
