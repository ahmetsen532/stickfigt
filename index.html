<!DOCTYPE html>
<html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Stick Fighter Arena</title><style>
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:#0d0818;color:#eee;font:14px system-ui,sans-serif}
canvas{position:fixed;inset:0;width:100vw;height:100vh;display:block}
#result{position:fixed;inset:0;z-index:10;background:rgba(10,5,20,.82);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px}
#result[hidden],#panel[hidden]{display:none}
#result h1{margin:0;font-size:38px}
table{border-collapse:collapse;min-width:420px}
th,td{padding:5px 16px;text-align:center;border-bottom:1px solid #ffffff22}
button{background:#f0794f;color:#1a0f2b;border:0;border-radius:6px;padding:8px 14px;font-weight:700;cursor:pointer}
#gear{position:fixed;right:12px;bottom:12px;z-index:5}
#panel{position:fixed;right:12px;bottom:56px;z-index:5;width:470px;max-width:96vw;max-height:75vh;overflow:auto;background:#150b2ee8;border:1px solid #ffffff30;border-radius:8px;padding:10px;display:flex;flex-direction:column;gap:8px}
#rows{display:flex;flex-direction:column;gap:5px}
.row{display:flex;gap:4px;align-items:center}
.row input[type=text]{width:92px;background:#0004;border:1px solid #ffffff33;color:#fff;border-radius:4px;padding:3px 5px}
.row select{background:#0004;color:#fff;border:1px solid #ffffff33;border-radius:4px;padding:3px;max-width:105px}
.row input[type=color]{width:26px;height:26px;border:0;padding:0;background:none}
</style></head>
<body>
<canvas id="c"></canvas><div id="result" hidden></div>
<button id="gear">⚙ Ayarlar</button>
<div id="panel" hidden>
  <div id="rows"></div>
  <label>Oyun hızı <input id="speed" type="range" min="0.5" max="2" step="0.1" value="1"></label>
  <div><button id="rnd">🎲 Rastgele silahlar</button> <button id="restart">Yeni savaş (R)</button></div>
</div>

<script>
// Tüm ayarlar burada. Silah ve özel hareketleri oyun içinden (⚙ Ayarlar) de değiştirebilirsin.
const CFG = {
  W: 1280, H: 720, GROUND: 650, L: 40, R: 1240, GRAVITY: 2400, SPEEDMUL: 1.35, K: .7, plats: [],
  STYLES: {
    aggressive: { aggr: .95, defend: .10, pref: 0,  jump: .08, rnd: 0 },
    defensive:  { aggr: .45, defend: .60, pref: 60, jump: .08, rnd: 0 },
    fast:       { aggr: .80, defend: .30, pref: 20, jump: .18, rnd: 0 },
    strong:     { aggr: .60, defend: .15, pref: 0,  jump: .04, rnd: 0 },
    balanced:   { aggr: .70, defend: .30, pref: 10, jump: .10, rnd: 0 },
    erratic:    { aggr: .70, defend: .20, pref: 0,  jump: .30, rnd: .5 }
  },
  // t: m=yakın, g=mermi, l=lazer | dmg: hasar çarpanı | rng: menzil | rate: saldırı hızı
  WEAPONS: {
    fist:    { n: 'Yumruk',        t: 'm', dmg: 1,   rng: 78,  rate: 1, fist: 1 },
    sword:   { n: 'Kılıç',         t: 'm', dmg: 1.7, rng: 120, rate: 1, len: 46, col: '#cfd8dc', slash: 1 },
    katana:  { n: 'Katana',        t: 'm', dmg: 1.5, rng: 130, rate: 1.25, len: 56, col: '#e0f7fa', slash: 1 },
    axe:     { n: 'Balta',         t: 'm', dmg: 2, rng: 110, rate: .8, len: 42, col: '#b0bec5', slash: 1, kb: 1, head: 18 },
    hammer:  { n: 'Çekiç',         t: 'm', dmg: 2.9, rng: 112, rate: .9, len: 44, col: '#ffcc80', slash: 1, kb: 1, head: 16, quake: 1 },
    spear:   { n: 'Mızrak',        t: 'm', dmg: 1.3, rng: 150, rate: .9, len: 72, col: '#d7ccc8' },
    energy:  { n: 'Enerji kılıcı', t: 'm', dmg: 1.6, rng: 125, rate: 1, len: 54, col: '#00e5ff', slash: 1, glow: 1 },
    pistol:  { n: 'Tabanca',       t: 'g', dmg: .8,  rng: 550, rate: 1.2, len: 20, col: '#ffe082', spd: 1100, mag: 6 },
    shotgun: { n: 'Pompalı',       t: 'g', dmg: .75, rng: 340, rate: .55, len: 36, col: '#ffcc80', spd: 900, pel: 5, spread: .25, mag: 2 },
    rifle:   { n: 'Saldırı tüfeği',t: 'g', dmg: .45, rng: 650, rate: .8, len: 40, col: '#ffe082', spd: 1300, burst: 3, mag: 2 },
    laser:   { n: 'Lazer',         t: 'l', dmg: .95, rng: 600, rate: .5, len: 30, col: '#ff4081', mag: 3 }
  },
  // r: yapay zekânın bu hareketi kullanmayı seçtiği en fazla mesafe
  SPECIALS: {
    dash:     { n: 'Işınlanma',        r: 520 },
    fireball: { n: 'Ateş topu',        r: 650 },
    slam:     { n: 'Yere çarpma',      r: 300 },
    blast:    { n: 'Enerji patlaması', r: 260 }
  },
  FIGHTERS: [
    { name: 'şen', color: '#e57373', style: 'aggressive', hp: 100, atk: 9,  spd: 250, weapon: 'hammer',  special: 'slam' },
    { name: 'ışıl', color: '#64b5f6', style: 'defensive',  hp: 110, atk: 8,  spd: 230, weapon: 'katana',  special: 'dash' },
    { name: 'selman', color: '#ffd54f', style: 'fast',       hp: 90,  atk: 6,  spd: 340, weapon: 'pistol',  special: 'fireball' },
    { name: 'hümeyra', color: '#81c784', style: 'strong',     hp: 130, atk: 13, spd: 170, weapon: 'axe',     special: 'slam' },
    { name: 'sümeyye', color: '#ba68c8', style: 'balanced',   hp: 100, atk: 8,  spd: 240, weapon: 'laser',   special: 'blast' },
    { name: 'samet', color: '#ffb74d', style: 'erratic',    hp: 100, atk: 9,  spd: 260, weapon: 'shotgun', special: 'fireball' },
    { name: 'ahmetselim', color: '#eceff1', style: 'aggressive', hp: 95,  atk: 10, spd: 270, weapon: 'energy',  special: 'dash' }
  ]
};

// Parçacıklar, hasar yazıları, kamera sarsıntısı ve arka plan
class FX {
  constructor() { this.p = []; this.t = []; this.r = []; this.shake = 0; }
  clear() { this.p = []; this.t = []; this.r = []; this.shake = 0; }
  burst(x, y, col, n = 10, sp = 380) {
    for (let i = 0; i < n; i++) {
      const a = Math.random() * 6.28, v = sp * (.3 + Math.random() * .7);
      this.p.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v - 120, l: .35 + Math.random() * .3, m: .65, s: 2 + Math.random() * 3, c: col, g: 1 });
    }
  }
  dust(x, y) {
    for (let i = 0; i < 6; i++) this.p.push({ x: x + (Math.random() - .5) * 30, y: y - 2, vx: (Math.random() - .5) * 160, vy: -Math.random() * 70, l: .5, m: .5, s: 4 + Math.random() * 5, c: '#cbbfae', g: 0 });
  }
  text(x, y, s, c) { this.t.push({ x, y, s, c, l: .8 }); }
  ring(x, y, c) { this.r.push({ x, y, c, l: .5 }); this.burst(x, y, c, 18, 500); }
  update(dt) {
    this.shake *= Math.pow(.001, dt);
    for (const p of this.p) { p.l -= dt; p.x += p.vx * dt; p.y += p.vy * dt; p.vy += p.g * 1400 * dt; }
    this.p = this.p.filter(p => p.l > 0);
    for (const t of this.t) { t.l -= dt; t.y -= 60 * dt; }
    this.t = this.t.filter(t => t.l > 0);
    for (const r of this.r) r.l -= dt; this.r = this.r.filter(r => r.l > 0);
  }
  draw(c) {
    for (const r of this.r) { c.globalAlpha = r.l * 2; c.strokeStyle = r.c; c.lineWidth = 6; c.beginPath(); c.arc(r.x, r.y, (.5 - r.l) * 600, 0, 7); c.stroke(); }
    for (const p of this.p) { c.globalAlpha = Math.min(1, p.l / p.m * 1.5); c.fillStyle = p.c; c.fillRect(p.x - p.s / 2, p.y - p.s / 2, p.s, p.s); }
    c.globalAlpha = 1; c.font = 'bold 20px sans-serif'; c.textAlign = 'center'; c.lineWidth = 3;
    for (const t of this.t) { c.globalAlpha = Math.min(1, t.l * 2); c.fillStyle = t.c; c.strokeStyle = '#000'; c.strokeText(t.s, t.x, t.y); c.fillText(t.s, t.x, t.y); }
    c.globalAlpha = 1;
  }
}

// Arka plan bir kez çizilir, her karede hazır görsel kullanılır (performans)
function makeBG() {
  const b = document.createElement('canvas'); b.width = CFG.W; b.height = CFG.H;
  const c = b.getContext('2d'), G = CFG.GROUND, W = CFG.W;
  let g = c.createLinearGradient(0, 0, 0, G);
  g.addColorStop(0, '#150b2e'); g.addColorStop(.6, '#5b2a73'); g.addColorStop(1, '#f0794f');
  c.fillStyle = g; c.fillRect(0, 0, W, G);
  c.fillStyle = '#ffffffaa';
  for (let i = 0; i < 160; i++) c.fillRect((i * 193) % W, (i * 71) % (G * .55), 2, 2);
  c.fillStyle = '#ffd9a0'; c.beginPath(); c.arc(W * .72, G - 170, 70, 0, 7); c.fill();
  for (let l = 0; l < 2; l++) {
    c.fillStyle = l ? '#1d1033' : '#2d1747'; c.beginPath(); c.moveTo(0, G);
    for (let x = 0; x <= W; x += 20) c.lineTo(x, G - 110 + l * 50 - (Math.sin(x * .01 + l * 2) * 50 + Math.sin(x * .027 + l) * 30));
    c.lineTo(W, G); c.fill();
  }
  g = c.createLinearGradient(0, G, 0, CFG.H); g.addColorStop(0, '#3a2a4a'); g.addColorStop(1, '#150e1d');
  c.fillStyle = g; c.fillRect(0, G, W, CFG.H - G);
  c.strokeStyle = 'rgba(255,255,255,.07)'; c.lineWidth = 1;
  for (let i = -12; i <= 12; i++) { c.beginPath(); c.moveTo(W / 2 + i * 40, G); c.lineTo(W / 2 + i * 150, CFG.H); c.stroke(); }
  c.strokeStyle = '#ffb27a'; c.lineWidth = 3; c.beginPath(); c.moveTo(0, G); c.lineTo(W, G); c.stroke();
  for (const p of CFG.plats) { c.fillStyle = '#2c2140'; c.fillRect(p.x, p.y, p.w, 16); c.fillStyle = '#ffb27a'; c.fillRect(p.x, p.y, p.w, 4); c.fillStyle = 'rgba(0,0,0,.25)'; c.fillRect(p.x + 10, p.y + 16, p.w - 20, 8); }
  c.fillStyle = 'rgba(255,178,122,.18)'; c.fillRect(0, 0, 14, G); c.fillRect(W - 14, 0, 14, G);
  g = c.createRadialGradient(W / 2, CFG.H / 2, 300, W / 2, CFG.H / 2, 800); g.addColorStop(0, 'rgba(0,0,0,0)'); g.addColorStop(1, 'rgba(0,0,0,.5)');
  c.fillStyle = g; c.fillRect(0, 0, W, CFG.H);
  return b;
}

// Stickman: iskelet tabanlı, kodla çizilir. Açılar mutlaktır: 0 = aşağı, PI/2 = ileri, PI = yukarı.
function shade(h, f) { const n = parseInt(h.slice(1), 16); return `rgb(${(n >> 16 & 255) * f | 0},${(n >> 8 & 255) * f | 0},${(n & 255) * f | 0})`; }
// Videodaki boksör duruşu: alçak, öne eğik, arka bacak uzun adımda, eldivenler çenede
const GUARD = { rot: 0, hipH: 39, lean: .3, aL1: .35, aL2: 3, aR1: .5, aR2: 2.9, lL1: -.7, lL2: -.8, lR1: .9, lR2: -.5 };
const prof = (k, a, b, w) => k < a ? -w * k / a : k < b ? -w + (1 + w) * (k - a) / (b - a) : 1 - (k - b) / (1 - b);
// (x,y) noktasının altındaki en yakın zemin/platform yüksekliği
const fl = (x, y) => { let f = CFG.GROUND; for (const p of CFG.plats) if (x > p.x && x < p.x + p.w && p.y >= y - 2 && p.y < f) f = p.y; return f; };

class Fighter {
  constructor(c, i, x, face) {
    this.c = c; this.i = i; this.maxHp = this.hp = c.hp; this.x = x; this.y = this.fl = CFG.GROUND; this.vx = this.vy = 0; this.face = face;
    this.state = 'idle'; this.t = Math.random(); this.phase = 0; this.hit = false; this.invul = 0; this.cool = .5; this.combo = 0; this.dead = false;
    this.en = 0; this.jumps = 0; this.wall = 0; this.wt = 0; this.relT = 0; this.gt = 0; this.gh = []; this.spin = 0; this.flip = false; this.trail = []; this.sp = 'dash'; this.alt = false; this.hi = 0; this.tc = '#fff'; this.D = .4; this.hb = .5;
    this.stats = { dealt: 0, taken: 0, kills: 0 }; this.mode = 'wait'; this.thinkT = Math.random() * .5; this.dodgeCD = 0;
    this.intent = { mx: 0 }; this.cur = Object.assign({}, GUARD);
  }
  get name() { return this.c.name; } get color() { return this.c.color; } get w() { return CFG.WEAPONS[this.c.weapon]; } get style() { return CFG.STYLES[this.c.style]; }
  canBeHit() { return this.hp > 0 && this.invul <= 0 && this.state !== 'down' && this.state !== 'getup'; }
  begin(k) {
    const r = this.w.rate || 1; this.state = k; this.t = 0; this.hit = false;
    if (k === 'punch') this.alt = !!this.w.fist && !this.alt; // jab, çapraz sırayla
    if (k === 'kick') this.hi = Math.random() < .4 ? 1 : 0;  // alçak / yüksek tekme
    this.D = { punch: .38 / r, swing: .55 / r, shoot: .32 / r, kick: .55, special: 1.1 }[k]; this.hb = { punch: .5, swing: .5, shoot: .4, kick: .55, special: .55 }[k];
  }
  primary() { const w = this.w; this.begin(w.t === 'm' ? (w.slash ? 'swing' : 'punch') : 'shoot'); }
  hurt(dir) { this.state = 'hurt'; this.t = 0; this.vx = dir * 200; this.face = -dir; this.invul = .08; }
  down(dir, ko) { this.state = 'down'; this.t = 0; this.vx = dir * (ko ? 420 : 320); this.vy = -(ko ? 620 : 450); this.face = -dir; this.combo = 0; this.invul = .3; }

  strike(kind, G) {
    const w = this.w, reach = kind === 'kick' ? 100 : w.rng, mult = kind === 'kick' ? 1.5 : w.dmg;
    for (const o of G.fighters) {
      if (o === this || !o.canBeHit()) continue;
      const dx = (o.x - this.x) * this.face;
      if (dx > -10 && dx < reach && Math.abs(o.y - this.y) < 70) G.hit(this, o, mult, kind === 'kick' || !!w.kb, this.face);
    }
    if (kind !== 'kick' && w.quake) { const qx = this.x + this.face * 95; G.fx.ring(qx, this.y, w.col); G.fx.dust(qx, this.y); G.fx.shake = Math.max(G.fx.shake, 14); }
  }
  fire(G) {
    const w = this.w, f = this.face, mx = this.x + f * 58, my = this.y - this.cur.hipH - 34;
    G.fx.burst(mx + f * 10, my, '#ffe082', 6, 260); G.fx.shake = Math.max(G.fx.shake, 3); this.vx -= f * 90;
    if (w.mag) { this.ammo = (this.ammo || w.mag) - 1; if (this.ammo <= 0) { this.ammo = w.mag; this.relT = 1.8; G.fx.text(this.x, this.y - 150, 'şarjör', '#fff'); } }
    if (w.t === 'l') {
      let best = null;
      for (const o of G.fighters) { const dx = (o.x - this.x) * f; if (o !== this && o.canBeHit() && dx > 0 && dx < w.rng && Math.abs(o.y - this.y) < 80 && (!best || dx < (best.x - this.x) * f)) best = o; }
      G.beams.push({ x1: mx, y1: my, x2: best ? best.x : this.x + f * w.rng, y2: my, c: w.col, l: .15 });
      if (best) G.hit(this, best, w.dmg * (1 - .4 * (best.x - this.x) * f / w.rng), false, f, 6);
    } else for (let i = 0, n = w.pel || w.burst || 1; i < n; i++) {
      const sp = w.spd * (w.burst ? 1 - i * .12 : 1);
      G.bullets.push({ x: mx, y: my, vx: f * sp, vy: w.pel ? (i - (n - 1) / 2) * w.spread * sp * .5 : 0, r: 2, dmg: w.dmg, c: w.col, o: this, l: w.rng / sp, x0: mx, rg: w.rng });
    }
  }

  update(dt, G) {
    this.t += dt; this.invul -= dt; this.cool -= dt; this.dodgeCD -= dt; this.en = Math.min(100, this.en + dt * 2);
    const ground = this.y >= this.fl - .5, s = this.state;
    if (ground) this.jumps = 0;
    if (s === 'idle' || s === 'run') {
      const i = this.intent, sp = this.c.spd * CFG.SPEEDMUL;
      this.vx += (i.mx * sp - this.vx) * Math.min(1, dt * (ground ? 14 : 3));
      if (i.jump && !this.wall && this.jumps < 2) { this.vy = ground ? -1000 : -900; this.vx = i.mx * sp * 1.5; this.jumps = ground ? 1 : 2; this.flip = Math.random() < .5; G.fx.dust(this.x, this.y); }
      if (!this.wall && this.cool <= 0) { if (i.kick) this.begin('kick'); else if (i.punch) this.primary(); }
      if (this.wall) { // duvara tutun, kay, sonra karşıya fırla
        this.vy = Math.min(this.vy, 140); this.vx = 0; this.face = this.wall; this.wt += dt;
        if (this.wt > .4 || i.jump) { this.vx = -this.wall * 650; this.vy = -950; this.flip = true; this.jumps = 1; G.fx.burst(this.x, this.y - 60, this.color, 8, 250); this.wall = 0; this.wt = 0; }
      }
      if (this.state === 'idle' || this.state === 'run') this.state = ground && Math.abs(this.vx) > 25 ? 'run' : 'idle';
    } else if (s === 'punch' || s === 'swing' || s === 'shoot' || s === 'kick') {
      if (!this.hit && this.t >= this.D * this.hb) { this.hit = true; if (s === 'shoot') this.fire(G); else { this.vx += this.face * 160; this.strike(s, G); } }
      if (this.t >= this.D) { this.state = 'idle'; this.cool = Math.max((.2 + Math.random() * .3) / (this.c.spd / 250), this.relT); this.relT = 0; }
      this.vx *= Math.max(0, 1 - 6 * dt);
    } else if (s === 'special') {
      this.vx *= Math.max(0, 1 - 8 * dt);
      if (!this.hit && this.t >= .6) { this.hit = true; G.special(this, this.sp); }
      if (this.sp === 'slam' && this.hit) {
        if (this.vy > 0) this.vy += 3500 * dt;
        if (ground && this.t > .75) { G.fx.ring(this.x, this.y, this.color); G.aoe(this, 240, 2.2, true); G.fx.shake = 20; this.state = 'idle'; }
      } else if (this.t >= 1.1) this.state = 'idle';
    } else {
      this.vx *= Math.max(0, 1 - (ground ? 7 : 1.5) * dt);
      if (s === 'hurt' && this.t > .35) this.state = 'idle';
      if (s === 'block' && this.t > .5) this.state = 'idle';
      if (s === 'down' && this.t > .9 && ground) { if (this.hp > 0) { this.state = 'getup'; this.t = 0; } else this.dead = true; }
      if (s === 'getup' && this.t > .5) this.state = 'idle';
    }
    this.spin = this.flip && !ground && (s === 'idle' || s === 'run') ? Math.max(-6.28, this.spin - dt * 11) : 0;
    const py = this.y; this.vy += CFG.GRAVITY * dt; this.y += this.vy * dt; this.x += this.vx * dt;
    const f0 = fl(this.x, py);
    if (this.vy >= 0 && this.y >= f0) { if (this.vy > 500) G.fx.dust(this.x, f0); this.y = f0; this.vy = 0; }
    this.fl = fl(this.x, this.y);
    if (this.x < CFG.L) { this.x = CFG.L; this.vx = 0; } else if (this.x > CFG.R) { this.x = CFG.R; this.vx = 0; }
    const gnd = this.y >= this.fl - .5, st = this.state;
    this.wall = !gnd && (st === 'idle' || st === 'run') && (this.x <= CFG.L + .5 || this.x >= CFG.R - .5) ? (this.x < CFG.W / 2 ? -1 : 1) : 0;
    if (!this.wall) this.wt = 0;
    if ((Math.hypot(this.vx, this.vy) > 560 || st === 'special') && (this.gt -= dt) <= 0) { this.gt = .035; this.gh.push({ x: this.x, y: this.y, f: this.face, s: this.spin, p: Object.assign({}, this.cur), a: .35 }); }
    for (const g of this.gh) g.a -= dt * 1.4; this.gh = this.gh.filter(g => g.a > 0);
    if (ground) this.phase += Math.abs(this.vx) * dt * .05;
    const g = this.pose(), sp = (s === 'punch' || s === 'swing' || s === 'shoot' || s === 'kick') ? 45 : s === 'down' ? 16 : 24;
    for (const k in g) this.cur[k] += (g[k] - this.cur[k]) * Math.min(1, dt * sp);
  }

  pose() {
    const g = Object.assign({}, GUARD), s = this.state, t = this.t, p = this.phase, sn = Math.sin, air = this.y < this.fl - 2;
    if (s === 'punch' || s === 'swing' || s === 'shoot') {
      const e = prof(Math.min(1, t / this.D), .3, this.hb, s === 'shoot' ? .25 : s === 'swing' ? .6 : .5);
      if (s === 'swing') { g.aR1 = 2.6 - e * 1.3; g.aR2 = 3.2 - e * 1.7; g.lean = .25 + e * .3; g.lR1 = .9 + e * .3; }
      else if (s === 'punch' && this.alt) { // arka el çapraz: gövde döner, arka ayak iter
        g.aL1 = .35 + e * 1.2; g.aL2 = 3 - e * 1.43; g.lean = .3 + e * .3; g.lL1 = -.7 + e * .35; g.lL2 = -.8 + e * .35; g.lR1 = .9 + e * .15;
      } else { // ön el jab / silah doğrultma

// Yapay zekâ: silaha göre mesafe, platform gezinmesi, zıplayarak kaçınma/atılma, duvara tutunma.
const AI = {
  target(f, list) {
    let b = null, bd = 1e9;
    for (const o of list) { if (o === f || o.hp <= 0) continue; const d = Math.abs(o.x - f.x) + Math.abs(o.y - f.y) * .5; if (d < bd) { bd = d; b = o; } }
    return b;
  },
  // Hedef yüksekteyse, ulaşılabilir ve hedefe en yakın platformu seç
  nav(f, o) {
    let best = null, bs = 1e9;
    for (const p of CFG.plats) if (p.y < f.y - 30 && p.y >= f.y - 230) { const sc = Math.abs(p.x + p.w / 2 - o.x) + Math.abs(p.y - o.y); if (sc < bs) { bs = sc; best = p; } }
    return best;
  },
  run(f, list, dt) {
    const i = f.intent = { mx: 0 }, o = this.target(f, list); if (!o) return;
    const s = f.style, w = f.w, gun = w.t !== 'm', dx = o.x - f.x, d = Math.abs(dx), dy = Math.abs(o.y - f.y), dir = Math.sign(dx) || 1;
    const free = f.state === 'idle' || f.state === 'run', onG = f.y >= f.fl - 1;
    const reach = gun ? Math.min(w.rng, 600) : w.rng * .85, near = (gun ? reach * .6 : reach * .8) + s.pref;
    if (free && !f.wall) f.face = dir;

      else if (s.rnd && r < s.rnd) f.mode = ['approach', 'retreat', 'wait', 'jump', 'wall'][Math.random() * 5 | 0];

      else f.mode = r < s.aggr ? 'attack' : (r < s.aggr + s.defend / 2 ? 'retreat' : 'wait');

    }

// Ana döngü: tam ekran arena, mermiler, özel hareketler, sonuç ekranı, arayüz
const cv = document.getElementById('c'), ctx = cv.getContext('2d'), R = document.getElementById('result');
const fx = new FX(), esc = s => String(s).replace(/[&<>"]/g, c => '&#' + c.charCodeAt(0) + ';');
const G = { fx, fighters: [], bullets: [], beams: [], dmg: 1, idle: 0, flash: 0 };
let idleT = 0, bg, over = false, endT = 0, elapsed = 0, slow = 0, stop = 0, speed = 1, last = performance.now();

function layout() {
  const K = CFG.K; cv.width = innerWidth; cv.height = innerHeight;

  CFG.R = W - 40;

// a, b'ye vurur. mult: hasar çarpanı, down: yere devirir, dir: savrulma yönü
G.hit = (a, b, mult, down, dir = a.face, shk = 5) => {
  const blk = b.state === 'block' && b.face === -dir && mult < 2.5, dm = a.c.atk * mult * G.dmg * (.85 + Math.random() * .3) * (blk ? .2 : 1), d = Math.min(b.hp, dm);

  for (const o of G.fighters) { if (o === a || !o.canBeHit()) continue; const dx = o.x - a.x; if (Math.abs(dx) < r && Math.abs(o.y - a.y) < 160) G.hit(a, o, mult, down, Math.sign(dx) || 1, 10); }
};

  else if (sp === 'slam') f.vy = -1100;

};

function start() {
  const list = CFG.FIGHTERS.filter(c => c.on !== false);
  if (list.length < 2) { CFG.FIGHTERS.forEach(c => c.on = true); document.querySelectorAll('.row input[type=checkbox]').forEach(e => e.checked = true); return start(); }
  const n = list.length;
  G.fighters = list.map((c, i) => new Fighter(c, i, 120 + i * (CFG.W - 240) / (n - 1), i < n / 2 ? 1 : -1));
  G.bullets = []; G.beams = []; G.idle = 0; over = false; endT = 0; elapsed = 0; slow = 0; fx.clear(); R.hidden = true;
}

function showResult(w) {
  const m = Math.floor(elapsed / 60), s = Math.floor(elapsed % 60);
  const rows = [...G.fighters].sort((a, b) => b.stats.kills - a.stats.kills || b.stats.dealt - a.stats.dealt)
    .map(f => `<tr><td style="color:${f.color}">${esc(f.name)}</td><td>${f.stats.dealt | 0}</td><td>${f.stats.taken | 0}</td><td>${f.stats.kills}</td></tr>`).join('');
  R.innerHTML = `<h1 style="color:${w ? w.color : '#fff'}">${w ? esc(w.name) + ' kazandı!' : 'Berabere!'}</h1><p>Süre: ${m}:${String(s).padStart(2, '0')}</p>
  <table><tr><th>Savaşçı</th><th>Verilen hasar</th><th>Alınan hasar</th><th>Eleme</th></tr>${rows}</table><button onclick="start()">Yeniden savaş</button>`;
  R.hidden = false;
}

function hud() {
  const n = G.fighters.length, w = (cv.width - 40) / n;
  G.fighters.forEach((f, i) => {
    const x = 20 + i * w + 4, bw = w - 8;
    ctx.globalAlpha = f.hp > 0 ? 1 : .4; ctx.textAlign = 'left'; ctx.font = 'bold 14px sans-serif'; ctx.fillStyle = f.color; ctx.fillText(f.name + ' · ' + f.w.n, x, 24);
    ctx.fillStyle = 'rgba(0,0,0,.55)'; ctx.fillRect(x, 30, bw, 12); ctx.fillStyle = f.color; ctx.fillRect(x, 30, bw * f.hp / f.maxHp, 12);
    ctx.strokeStyle = '#fff6'; ctx.lineWidth = 1; ctx.strokeRect(x, 30, bw, 12);
    ctx.fillStyle = 'rgba(0,0,0,.55)'; ctx.fillRect(x, 45, bw, 5); ctx.fillStyle = f.en >= 100 ? '#fff' : '#ffd740'; ctx.fillRect(x, 45, bw * f.en / 100, 5);
  });
  ctx.globalAlpha = 1;
}

function frame(now) {

  for (let i = 0; i < F.length; i++) for (let j = i + 1; j < F.length; j++) {
    const a = F[i], b = F[j]; if (a.hp <= 0 || b.hp <= 0 || Math.abs(a.y - b.y) > 40 || a.y < a.fl - 5 || b.y < b.fl - 5) continue;
    const dx = b.x - a.x, ad = Math.abs(dx);

  }

    b.x += b.vx * dt; b.y += (b.vy || 0) * dt; b.l -= dt; if (b.big) fx.burst(b.x, b.y, '#ffab40', 1, 60);
    for (const o of F) if (o !== b.o && o.canBeHit() && Math.abs(b.x - o.x) < 20 + b.r && Math.abs(b.y - (o.y - 65)) < 55) {
      G.hit(b.o, o, b.dmg * (b.rg ? 1 - .5 * Math.min(1, Math.abs(b.x - b.x0) / b.rg) : 1), !!b.big, Math.sign(b.vx), 4); fx.burst(b.x, b.y, b.c, b.big ? 20 : 8); b.l = 0; break;
    }
  }
  G.bullets = G.bullets.filter(b => b.l > 0 && b.x > -50 && b.x < CFG.W + 50);
  for (const b of G.beams) b.l -= real; G.beams = G.beams.filter(b => b.l > 0);
  fx.update(dt);
  const alive = F.filter(f => f.hp > 0);
  if (!over && alive.length <= 1) { over = true; endT = 0; }
  if (over) {
    endT += real; const w = alive[0];
    if (w && endT > 1.3 && (w.state === 'idle' || w.state === 'run')) { w.state = 'win'; w.t = 0; }
    if (endT > 3.8 && R.hidden) showResult(w);
  }
  ctx.setTransform(CFG.K, 0, 0, CFG.K, 0, 0); ctx.drawImage(bg, 0, 0);
  ctx.translate((Math.random() - .5) * fx.shake, (Math.random() - .5) * fx.shake);
  [...F].sort((a, b) => a.y - b.y).forEach(f => f.draw(ctx));
  for (const b of G.bullets) {
    ctx.shadowColor = b.c; ctx.shadowBlur = 12; ctx.fillStyle = ctx.strokeStyle = b.c;
    if (b.big) { ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, 7); ctx.fill(); } else { ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(b.x, b.y); ctx.lineTo(b.x - Math.sign(b.vx) * 18, b.y); ctx.stroke(); }
  }
  for (const b of G.beams) { ctx.shadowColor = b.c; ctx.shadowBlur = 20; ctx.globalAlpha = Math.min(1, b.l * 8); ctx.strokeStyle = b.c; ctx.lineWidth = 8; ctx.beginPath(); ctx.moveTo(b.x1, b.y1); ctx.lineTo(b.x2, b.y2); ctx.stroke(); ctx.strokeStyle = '#fff'; ctx.lineWidth = 3; ctx.stroke(); }
  ctx.shadowBlur = 0; ctx.globalAlpha = 1;
  fx.draw(ctx); ctx.setTransform(1, 0, 0, 1, 0, 0);
  if (G.flash > 0) { G.flash -= real; ctx.fillStyle = 'rgba(255,255,255,.3)'; ctx.fillRect(0, 0, cv.width, cv.height); }
  hud();
  requestAnimationFrame(frame);
}

// Arayüz: isim, renk, silah, özel hareket, katılım
const rowsEl = document.getElementById('rows'), panel = document.getElementById('panel');
const opt = (o, v) => Object.entries(o).map(([k, x]) => `<option value="${k}"${k === v ? ' selected' : ''}>${x.n}</option>`).join('');
CFG.FIGHTERS.forEach(c => {
  const r = document.createElement('div'); r.className = 'row';
  r.innerHTML = `<input type="checkbox" checked><input type="color" value="${c.color}"><input type="text" value="${esc(c.name)}" maxlength="14"><select>${opt(CFG.WEAPONS, c.weapon)}</select><select>${opt(CFG.SPECIALS, c.special)}</select>`;
  const [on, col, nm] = r.querySelectorAll('input'), [ws, ss] = r.querySelectorAll('select');
  on.onchange = () => c.on = on.checked; col.oninput = () => c.color = col.value; nm.oninput = () => c.name = nm.value;
  ws.onchange = () => c.weapon = ws.value; ss.onchange = () => c.special = ss.value; c.ui = { ws, ss }; rowsEl.append(r);
});
document.getElementById('speed').oninput = e => speed = +e.target.value;
document.getElementById('restart').onclick = start;
document.getElementById('gear').onclick = () => panel.hidden = !panel.hidden;
document.getElementById('rnd').onclick = () => CFG.FIGHTERS.forEach(c => {
  const W = Object.keys(CFG.WEAPONS), S = Object.keys(CFG.SPECIALS);
  c.weapon = c.ui.ws.value = W[Math.random() * W.length | 0]; c.special = c.ui.ss.value = S[Math.random() * S.length | 0];
});
addEventListener('keydown', e => { if (e.key === 'r' || e.key === 'R') start(); });
addEventListener('resize', layout);
layout(); start(); requestAnimationFrame(frame);

</script>
